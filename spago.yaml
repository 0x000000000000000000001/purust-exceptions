package:
  name: exceptions
  dependencies:
    - effect
    - either
    - maybe
    - prelude

  test:
    main: Test.Runner
    dependencies:
      - assert
      - console
      - refs

workspace:
  backend:
    cmd: ../purust/bin/purust
    args: [--main, Test.Runner, --source, output, --out, output/purust_output]
  packageSet:
    registry: 77.7.0
  extraPackages:
    assert:
      path: "../purust-assert"
    console:
      path: "../purust-console"
    effect:
      path: "../purust-effect"
    refs:
      path: "../purust-refs"
    prelude:
      path: "../purust-prelude"
    partial:
      path: "../purust-partial"
